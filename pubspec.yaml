name: tmk_kuwait
description: TMK 53 Flutter mobile app
publish_to: 'none'
version: 1.5.9+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  google_fonts: ^8.2.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  flutter_web_auth_2: ^4.1.0
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1
  webview_flutter: ^4.12.0
  webview_flutter_android: ^4.12.0
  adhan_dart: ^2.0.1
  audioplayers: ^6.5.0
  mobile_scanner: ^7.4.0
  firebase_core: any
  firebase_messaging: any
  uuid: ^4.6.0
  desktop_webview_window: ^0.2.3
  path_provider: ^2.1.6
  package_info_plus: ^8.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/tmk_logo.png
    - assets/images/tmk_crest.png
    - assets/images/app_icon.png
    - assets/images/app_icon_foreground.png
    - assets/images/app_icon_branded.png
    - assets/images/app_icon_transparent.png
    - assets/images/app_icon_foreground_branded.png
    - assets/images/app_icon_adaptive_fg.png
    - assets/images/kaaba_3d.png
    - assets/sounds/scan_success.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon_transparent.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_adaptive_fg.png
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: assets/images/app_icon_transparent.png
    background_color: "#F5EFD8"
    theme_color: "#3D1035"
  windows:
    generate: true
    image_path: assets/images/app_icon_transparent.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/app_icon_transparent.png
